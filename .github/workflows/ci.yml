name: Build and boot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: code
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm lld qemu-system-x86 ovmf make python3 mtools gdb gcc
      - name: Check toolchain
        run: python3 tools/build.py doctor
      - name: Run complete host test shard
        run: python3 tools/ci_unittest.py --suite host --index ${{ matrix.shard }} --count 4
      - name: Save shard inventory and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.shard }}-evidence
          path: |
            code/build/test/ci-inventory/
            code/build/test/**/validation-summary.json
            code/build/test/**/summary.json
          if-no-files-found: error
          retention-days: 14
  language-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: code
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm lld qemu-system-x86 ovmf make python3 mtools gdb gcc
      - name: Check toolchain
        run: python3 tools/build.py doctor
      - name: Run complete language test shard
        run: python3 tools/ci_unittest.py --suite language --index ${{ matrix.shard }} --count 6
      - name: Save shard inventory and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: language-${{ matrix.shard }}-evidence
          path: |
            code/build/test/ci-inventory/
            code/build/test/**/validation-summary.json
            code/build/test/**/summary.json
          if-no-files-found: error
          retention-days: 14
  boot-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: p0
            command: tests/run_qemu.py --stage p0
          - group: p1
            command: tests/run_qemu.py --stage p1 --all
          - group: cpu
            command: tests/run_cpu_qemu.py --all
          - group: memory
            command: tests/run_memory_qemu.py --all
          - group: hardening
            command: tests/run_hardening_qemu.py --all
          - group: cache
            command: tests/run_cache_qemu.py --all
          - group: permission
            command: tests/run_permission_qemu.py --all
          - group: acpi
            command: tests/run_acpi_qemu.py --all
          - group: runtime
            command: tests/run_runtime_qemu.py --all
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: code
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm lld qemu-system-x86 ovmf make python3 mtools gdb gcc
      - name: Check toolchain
        run: python3 tools/build.py doctor
      - name: Run unchanged QEMU group
        run: python3 ${{ matrix.command }}
      - name: Save boot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ matrix.group }}-evidence
          path: code/build/test/
          if-no-files-found: warn
          retention-days: 14
  build-and-boot:
    name: build-and-boot
    if: always()
    needs: [host-tests, language-tests, boot-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test shard and boot group
        env:
          HOST_RESULT: ${{ needs.host-tests.result }}
          LANGUAGE_RESULT: ${{ needs.language-tests.result }}
          BOOT_RESULT: ${{ needs.boot-tests.result }}
        run: |
          test "$HOST_RESULT" = success
          test "$LANGUAGE_RESULT" = success
          test "$BOOT_RESULT" = success
