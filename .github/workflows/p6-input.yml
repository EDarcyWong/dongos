name: P6 input IRQ regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-irq:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install standard native test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm gcc python3
      - name: Execute production input IRQ and real-source negative controls
        run: python3 -m unittest tests.test_input_service tests.test_usb_input_entry tests.test_usb_input_usbonly tests.test_boot_trace_oracle -v
      - name: Save exact source and native execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p6-input-irq-evidence
          path: |
            code/build/test/input-service/
            code/build/test/usb-input-entry/
            code/build/test/usb-input-usbonly/
          if-no-files-found: error
