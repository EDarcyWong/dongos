[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dongos-coordination"
version = "0.1.0"
description = "Local task console and CLI coordination for DongOS"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dongos-coordinate = "dongos_coordination.cli:main"

[tool.setuptools.package-data]
dongos_coordination = ["web/*.html", "web/*.js", "web/*.css", "docs/*.md"]

[tool.setuptools.packages.find]
include = ["dongos_coordination*"]
